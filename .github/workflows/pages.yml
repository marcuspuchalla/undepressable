# Publish the app on GitHub Pages from every push to main.
#
# What gets published is the single-file build (dist-portable/
# undepressable.html): it runs under any path, with its routes in the hash,
# so it needs no server configuration — the same file "Pass the app on"
# hands out. Alongside it: the evidence checker (verify.html).
#
# One-time setup in the repository (a workflow token cannot do it): Settings →
# Pages → Build and deployment → Source: GitHub Actions. A private repository
# needs a plan that includes Pages, or make it public. The site then lives at
# https://<owner>.github.io/<repo>/ and redeploys on every push to main.

name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Would create the Pages site if the repository has none — but GitHub
      # refuses that from a workflow token ("Resource not accessible by
      # integration"), so the site must be enabled once by hand: Settings →
      # Pages → Source: GitHub Actions. Until then the deploy step says so.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - run: npm run build:verify
      - run: npm run build:portable
      - name: Lay out the site
        run: |
          mkdir -p site
          cp dist-portable/undepressable.html site/index.html
          cp dist-portable/undepressable.html site/404.html
          cp dist-portable/undepressable.html site/undepressable.html
          cp dist-verify/verify.html site/verify.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
