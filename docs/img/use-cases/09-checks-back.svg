<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Every copy checks back to the camera: the phone signs its picture twice a second">
  <title>Every copy checks back to the camera: the phone signs its picture twice a second</title>
  <style> .art{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round} .ink{mix-blend-mode:screen} .p14{animation:p14 1.5s 0s infinite linear;opacity:0}@keyframes p14{0%{transform:translate(0,0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translate(46px,0px);opacity:0}} .p15{animation:p15 1.5s 0.5s infinite linear;opacity:0}@keyframes p15{0%{transform:translate(0,0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translate(46px,0px);opacity:0}} .p16{animation:p16 1.5s 1s infinite linear;opacity:0}@keyframes p16{0%{transform:translate(0,0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translate(46px,0px);opacity:0}} .ok{animation:ok .5s infinite}@keyframes ok{0%,100%{opacity:.3}50%{opacity:1}} @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
